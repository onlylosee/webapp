<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO Meta Tags -->
    <title>TON STOCKER - AI Investment Platform</title>
    <meta name="description" content="TON STOCKER - современная AI-инвестиционная платформа с гарантированным доходом до 6.5% в день" />
    <meta name="keywords" content="TON, STOCKER, investment, crypto, AI, platform" />
    <meta name="author" content="TON STOCKER" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="TON STOCKER - AI Investment Platform" />
    <meta property="og:description" content="Современная AI-инвестиционная платформа с гарантированным доходом до 6.5% в день" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://via.placeholder.com/1200x630/3f51b5/ffffff?text=TON+STOCKER" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />

    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- CSS Styles -->
    <link rel="stylesheet" href="/app.css">

    <!-- External Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- Preconnect to API -->
    <link rel="preconnect" href="https://server-3hznro02y-onlylosees-projects.vercel.app">

    <style>
        /* Critical CSS для быстрой загрузки */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: white;
            overflow-x: hidden;
        }

        .initial-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeOut 0.5s ease-out 2s forwards;
        }

        .initial-loader-logo {
            font-size: 4rem;
            margin-bottom: 2rem;
            animation: bounce 1s ease-in-out infinite;
        }

        .initial-loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #3f51b5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .initial-loader-text {
            margin-top: 2rem;
            text-align: center;
        }

        .initial-loader-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3f51b5, #1a237e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .initial-loader-subtitle {
            color: #666;
            font-size: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% { transform: translateY(0); }
            40%, 43% { transform: translateY(-10px); }
            70% { transform: translateY(-5px); }
            90% { transform: translateY(-2px); }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        /* Скрыть контент до загрузки */
        #root {
            opacity: 0;
            animation: fadeIn 0.5s ease-out 2s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Initial Loading Screen -->
    <div class="initial-loader">
        <div class="initial-loader-logo">🚀</div>
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">
            <div class="initial-loader-title">TON STOCKER</div>
            <div class="initial-loader-subtitle">AI Investment Platform</div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="root">
        <!-- Fallback для пользователей без JavaScript -->
        <noscript>
            <div style="text-align: center; padding: 2rem; color: #666;">
                <h2>🚫 JavaScript Required</h2>
                <p>Для работы TON STOCKER необходимо включить JavaScript в вашем браузере.</p>
            </div>
        </noscript>

        <!-- Loading fallback -->
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 1rem;">
            <div style="font-size: 3rem;">⏳</div>
            <div style="color: #666;">Инициализация приложения...</div>
        </div>
    </div>

    <!-- Main App Script -->
    <script type="text/babel" src="/app.js"></script>

    <!-- Analytics and Error Tracking -->
    <script>
        // Обработка ошибок
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
        });

        // Обработка unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
        });

        // Telegram WebApp инициализация
        if (window.Telegram && window.Telegram.WebApp) {
            console.log('Telegram WebApp detected');
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Service Worker для кеширования (опционально)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Можно добавить service worker для офлайн режима
            });
        }

        // Удаляем initial loader после полной загрузки
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.querySelector('.initial-loader');
                if (loader) {
                    loader.style.display = 'none';
                }
            }, 2000);
        });
    </script>
</body>
</html>
