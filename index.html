<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#3f51b5" />
    <title>TON STOCKER - Investment Platform</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        /* TON STOCKER v3 - Ваш стиль */
        :root {
          --primary: #3f51b5;
          --primary-light: #5c6bc0;
          --primary-dark: #1a237e;
          --secondary: #00bcd4;
          --success: #4caf50;
          --success-light: #81c784;
          --warning: #ff9800;
          --error: #f44336;
          --info: #2196f3;

          --bg-primary: #0a0a0a;
          --bg-secondary: #1a1a1a;
          --bg-card: #1e1e1e;
          --bg-elevated: #2a2a2a;

          --text-primary: #ffffff;
          --text-secondary: #b0b0b0;
          --text-muted: #666666;

          --border: #333333;
          --border-light: #404040;

          --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
          --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
          --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

          --radius-sm: 8px;
          --radius-md: 12px;
          --radius-lg: 16px;
          --radius-xl: 24px;

          --gradient-primary: linear-gradient(135deg, var(--primary), var(--primary-dark));
          --gradient-success: linear-gradient(135deg, var(--success), #388e3c);
          --gradient-card: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));

          --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          --transition-fast: all 0.15s ease-out;
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          line-height: 1.6;
          overflow-x: hidden;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          scroll-behavior: smooth;
          padding-bottom: 80px; /* Space for bottom nav */
        }

        .app {
          max-width: 500px;
          margin: 0 auto;
          min-height: 100vh;
          background: var(--bg-primary);
          position: relative;
          overflow-x: hidden;
        }

        /* Loading */
        .loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: var(--bg-primary);
        }

        .loading-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2rem;
          text-align: center;
          animation: fadeIn 0.6s ease-out;
        }

        .loading-logo {
          font-size: 4rem;
          animation: bounce 1s ease-in-out infinite;
        }

        .loading-spinner {
          width: 50px;
          height: 50px;
          border: 4px solid var(--border);
          border-top: 4px solid var(--primary);
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        .loading-content h2 {
          font-size: 2rem;
          font-weight: 700;
          background: var(--gradient-primary);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .loading-content p {
          color: var(--text-secondary);
          font-size: 1rem;
        }

        /* Error */
        .error-container {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 2rem;
        }

        .error-content {
          text-align: center;
          max-width: 400px;
        }

        .error-icon {
          font-size: 4rem;
          margin-bottom: 1.5rem;
          animation: shake 0.5s ease-in-out;
        }

        .retry-button {
          background: var(--gradient-primary);
          color: white;
          border: none;
          padding: 1rem 2rem;
          border-radius: var(--radius-md);
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: var(--transition);
          box-shadow: var(--shadow-md);
        }

        /* Header */
        .app-header {
          background: var(--gradient-primary);
          padding: 1.5rem;
          box-shadow: var(--shadow-lg);
          position: sticky;
          top: 0;
          z-index: 100;
          backdrop-filter: blur(10px);
        }

        .header-top {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
        }

        .app-title {
          font-size: 1.75rem;
          font-weight: 700;
          color: white;
          text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
          line-height: 1;
        }

        .app-subtitle {
          font-size: 0.8rem;
          color: rgba(255, 255, 255, 0.8);
          font-weight: 400;
          margin-top: 0.25rem;
        }

        .refresh-btn {
          background: rgba(255, 255, 255, 0.2);
          border: none;
          color: white;
          padding: 0.75rem;
          border-radius: 50%;
          cursor: pointer;
          transition: var(--transition);
          font-size: 1.2rem;
          display: flex;
          align-items: center;
          justify-content: center;
          backdrop-filter: blur(10px);
        }

        .refresh-btn:hover:not(:disabled) {
          background: rgba(255, 255, 255, 0.3);
          transform: rotate(180deg);
        }

        /* Content */
        .content {
          flex: 1;
          min-height: calc(100vh - 140px);
        }

        .screen {
          display: none;
          padding: 1rem;
          animation: fadeIn 0.3s ease-out;
        }

        .screen.active {
          display: block;
        }

        /* Cards */
        .card {
          background: var(--gradient-card);
          padding: 1.5rem;
          border-radius: var(--radius-lg);
          border: 1px solid var(--border);
          margin-bottom: 1rem;
          box-shadow: var(--shadow-md);
          transition: var(--transition);
          position: relative;
          overflow: hidden;
        }

        .card::before {
          content: '';
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
          transform: scale(0);
          transition: transform 0.6s ease;
        }

        .card:hover::before {
          transform: scale(1);
        }

        .card:hover {
          transform: translateY(-4px);
          box-shadow: var(--shadow-lg);
          border-color: var(--primary-light);
        }

        .card-title {
          font-size: 1.2rem;
          font-weight: 700;
          color: var(--text-primary);
          margin-bottom: 1rem;
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }

        /* Balance Card - Особый стиль */
        .balance-card {
          background: var(--gradient-primary);
          color: white;
          text-align: center;
          position: relative;
          overflow: hidden;
        }

        .balance-card::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
          animation: shimmer 3s infinite;
        }

        .balance-amount {
          font-size: 2.5rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
          position: relative;
          z-index: 1;
          animation: balanceGlow 2s ease-in-out infinite;
        }

        .balance-label {
          opacity: 0.9;
          font-size: 1rem;
          position: relative;
          z-index: 1;
        }

        /* Project Bank Progress */
        .project-bank-card {
          background: var(--gradient-success);
          color: white;
        }

        .progress-bar {
          background: rgba(255, 255, 255, 0.2);
          border-radius: var(--radius-sm);
          height: 20px;
          margin: 1rem 0;
          overflow: hidden;
          position: relative;
        }

        .progress-fill {
          background: rgba(255, 255, 255, 0.8);
          height: 100%;
          border-radius: var(--radius-sm);
          transition: width 1s ease;
          position: relative;
        }

        .progress-fill::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
          animation: shimmer 2s infinite;
        }

        .progress-text {
          text-align: center;
          font-weight: 600;
          margin-top: 0.5rem;
        }

        /* Action Buttons */
        .action-buttons {
          display: flex;
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        .action-btn {
          flex: 1;
          background: var(--bg-card);
          border: 1px solid var(--border);
          color: var(--text-primary);
          padding: 1rem;
          border-radius: var(--radius-md);
          cursor: pointer;
          transition: var(--transition);
          font-weight: 600;
          font-size: 0.9rem;
          position: relative;
          overflow: hidden;
        }

        .action-btn::before {
          content: '';
          position: absolute;
          top: 50%;
          left: 50%;
          width: 0;
          height: 0;
          background: rgba(63, 81, 181, 0.2);
          border-radius: 50%;
          transform: translate(-50%, -50%);
          transition: all 0.6s ease;
        }

        .action-btn:active::before {
          width: 300px;
          height: 300px;
        }

        .action-btn:hover {
          background: var(--primary);
          transform: translateY(-2px);
          box-shadow: var(--shadow-md);
        }

        .action-btn.primary {
          background: var(--gradient-primary);
          color: white;
        }

        .action-btn.success {
          background: var(--gradient-success);
          color: white;
        }

        .action-btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
          transform: none;
        }

        /* Portfolio Stats */
        .portfolio-stats {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        .stat-card {
          background: var(--gradient-card);
          padding: 1.5rem;
          border-radius: var(--radius-lg);
          border: 1px solid var(--border);
          text-align: center;
          transition: var(--transition);
          position: relative;
          overflow: hidden;
        }

        .stat-card::before {
          content: '';
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: radial-gradient(circle, rgba(63, 81, 181, 0.1) 0%, transparent 70%);
          transform: scale(0);
          transition: transform 0.6s ease;
        }

        .stat-card:hover::before {
          transform: scale(1);
        }

        .stat-card:hover {
          transform: translateY(-4px);
          box-shadow: var(--shadow-lg);
          border-color: var(--primary-light);
        }

        .stat-value {
          font-size: 1.8rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
          color: var(--primary-light);
        }

        .stat-label {
          color: var(--text-secondary);
          font-size: 0.9rem;
          font-weight: 500;
        }

        /* Live Transactions */
        .transactions-live {
          background: var(--bg-card);
          border-radius: var(--radius-md);
          padding: 1rem;
          border: 1px solid var(--border);
          max-height: 300px;
          overflow-y: auto;
        }

        .transaction-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0.75rem 0;
          border-bottom: 1px solid var(--border);
          transition: var(--transition);
        }

        .transaction-item:last-child {
          border-bottom: none;
        }

        .transaction-item:hover {
          transform: translateX(8px);
          background: rgba(63, 81, 181, 0.05);
          border-radius: var(--radius-sm);
          margin: 0 -0.5rem;
          padding: 0.75rem 0.5rem;
        }

        .transaction-info {
          display: flex;
          flex-direction: column;
        }

        .transaction-type {
          font-weight: 600;
          margin-bottom: 0.25rem;
          color: var(--text-primary);
        }

        .transaction-date {
          font-size: 0.85rem;
          color: var(--text-secondary);
        }

        .transaction-amount {
          font-weight: 700;
          font-size: 1rem;
        }

        .transaction-amount.positive {
          color: var(--success);
        }

        .transaction-amount.negative {
          color: var(--error);
        }

        /* Card Design (special screen) */
        .card-design {
          background: var(--gradient-primary);
          color: white;
          border-radius: var(--radius-xl);
          padding: 2rem;
          margin-bottom: 1.5rem;
          position: relative;
          overflow: hidden;
          text-align: center;
        }

        .card-design::before {
          content: '';
          position: absolute;
          top: -50%;
          right: -50%;
          width: 200%;
          height: 200%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
          animation: rotate 20s linear infinite;
        }

        .card-balance {
          font-size: 2rem;
          font-weight: 700;
          margin-bottom: 1rem;
          position: relative;
          z-index: 1;
        }

        .card-subtitle {
          opacity: 0.9;
          position: relative;
          z-index: 1;
        }

        /* Calculator */
        .calculator {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          padding: 1.5rem;
          margin-bottom: 1.5rem;
        }

        .calc-input {
          width: 100%;
          background: var(--bg-elevated);
          border: 1px solid var(--border);
          color: var(--text-primary);
          padding: 1rem;
          border-radius: var(--radius-md);
          font-size: 1rem;
          margin-bottom: 1rem;
          transition: var(--transition);
        }

        .calc-input:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.1);
        }

        .calc-result {
          text-align: center;
          font-size: 1.2rem;
          font-weight: 600;
          color: var(--success);
          padding: 1rem;
          background: rgba(76, 175, 80, 0.1);
          border-radius: var(--radius-md);
          border: 1px solid rgba(76, 175, 80, 0.2);
        }

        /* About Features */
        .features-list {
          margin: 1.5rem 0;
        }

        .feature-item {
          display: flex;
          align-items: center;
          gap: 1rem;
          padding: 1rem 0;
          border-bottom: 1px solid var(--border);
          transition: var(--transition);
        }

        .feature-item:last-child {
          border-bottom: none;
        }

        .feature-item:hover {
          background: rgba(63, 81, 181, 0.05);
          margin: 0 -1rem;
          padding: 1rem;
          border-radius: var(--radius-md);
        }

        .feature-icon {
          font-size: 1.8rem;
          width: 50px;
          height: 50px;
          border-radius: var(--radius-md);
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(63, 81, 181, 0.1);
          color: var(--primary);
        }

        .feature-content {
          flex: 1;
        }

        .feature-title {
          font-weight: 600;
          margin-bottom: 0.25rem;
          color: var(--text-primary);
        }

        .feature-description {
          color: var(--text-secondary);
          font-size: 0.9rem;
        }

        /* Partners */
        .partner-stats {
          display: flex;
          justify-content: space-around;
          margin: 2rem 0;
          background: var(--bg-card);
          border-radius: var(--radius-md);
          padding: 1.5rem;
          border: 1px solid var(--border);
        }

        .partner-stat {
          text-align: center;
        }

        .partner-stat-value {
          font-size: 2rem;
          font-weight: 700;
          color: var(--primary);
          margin-bottom: 0.5rem;
        }

        .partner-stat-label {
          font-size: 0.9rem;
          color: var(--text-secondary);
        }

        .partner-levels {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          padding: 1.5rem;
          margin: 1.5rem 0;
        }

        .level-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem 0;
          border-bottom: 1px solid var(--border);
          transition: var(--transition);
        }

        .level-item:last-child {
          border-bottom: none;
        }

        .level-item:hover {
          background: rgba(63, 81, 181, 0.05);
          margin: 0 -1rem;
          padding: 1rem;
          border-radius: var(--radius-md);
        }

        .level-info {
          display: flex;
          flex-direction: column;
        }

        .level-title {
          font-weight: 600;
          margin-bottom: 0.25rem;
        }

        .level-desc {
          font-size: 0.85rem;
          color: var(--text-secondary);
        }

        .level-rate {
          font-size: 1.2rem;
          font-weight: 700;
        }

        .level-rate.gold { color: #FFD700; }
        .level-rate.silver { color: #C0C0C0; }
        .level-rate.bronze { color: #CD7F32; }

        /* Referral Link */
        .referral-link {
          background: var(--bg-elevated);
          padding: 1rem;
          border-radius: var(--radius-md);
          border: 1px solid var(--border-light);
          margin: 1rem 0;
        }

        .ref-code {
          background: var(--bg-primary);
          border: 1px solid var(--border);
          color: var(--primary-light);
          padding: 0.75rem;
          border-radius: var(--radius-sm);
          font-size: 0.9rem;
          font-weight: 600;
          font-family: 'Monaco', 'Menlo', monospace;
          word-break: break-all;
          margin-bottom: 1rem;
        }

        .copy-btn {
          width: 100%;
          background: var(--gradient-primary);
          color: white;
          border: none;
          padding: 0.75rem;
          border-radius: var(--radius-sm);
          cursor: pointer;
          font-weight: 600;
          transition: var(--transition);
        }

        .copy-btn:hover {
          transform: translateY(-2px);
          box-shadow: var(--shadow-md);
        }

        /* Footer Links */
        .footer-links {
          display: flex;
          justify-content: center;
          gap: 2rem;
          margin-top: 2rem;
          padding: 1.5rem;
          background: var(--bg-card);
          border-radius: var(--radius-md);
          border: 1px solid var(--border);
        }

        .footer-link {
          color: var(--primary);
          text-decoration: none;
          font-weight: 600;
          transition: var(--transition);
          padding: 0.5rem 1rem;
          border-radius: var(--radius-sm);
        }

        .footer-link:hover {
          color: var(--primary-light);
          background: rgba(63, 81, 181, 0.1);
          transform: translateY(-2px);
        }

        /* Bottom Navigation */
        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: var(--bg-secondary);
          border-top: 1px solid var(--border);
          padding: 0.75rem 0;
          display: flex;
          justify-content: space-around;
          align-items: center;
          backdrop-filter: blur(20px);
          z-index: 1000;
          box-shadow: var(--shadow-lg);
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.25rem;
          cursor: pointer;
          padding: 0.5rem;
          border-radius: var(--radius-md);
          transition: var(--transition);
          min-width: 60px;
        }

        .nav-item.active {
          background: var(--gradient-primary);
          color: white;
          transform: translateY(-2px);
          box-shadow: var(--shadow-md);
        }

        .nav-item:not(.active) {
          color: var(--text-secondary);
        }

        .nav-item:hover:not(.active) {
          background: var(--bg-elevated);
          color: var(--text-primary);
        }

        .nav-icon {
          font-size: 1.5rem;
        }

        .nav-label {
          font-size: 0.7rem;
          font-weight: 500;
        }

        /* Special card nav button */
        .nav-item.card-nav {
          background: var(--gradient-primary);
          color: white;
          border-radius: 50%;
          padding: 1rem;
          margin: 0 0.5rem;
          transform: scale(1.2);
          box-shadow: var(--shadow-lg);
        }

        .nav-item.card-nav .nav-icon {
          font-size: 2rem;
        }

        .nav-item.card-nav:hover {
          background: var(--gradient-primary);
          transform: scale(1.25);
        }

        .nav-item.card-nav.active {
          background: var(--primary-dark);
          transform: scale(1.2);
        }

        /* Empty states */
        .empty-state {
          text-align: center;
          padding: 3rem 1rem;
          color: var(--text-secondary);
        }

        .empty-icon {
          font-size: 4rem;
          margin-bottom: 1rem;
          opacity: 0.7;
        }

        .empty-title {
          font-size: 1.2rem;
          font-weight: 600;
          margin-bottom: 0.5rem;
          color: var(--text-primary);
        }

        .empty-desc {
          font-size: 0.9rem;
          color: var(--text-muted);
        }

        /* Animations */
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
          0%, 20%, 53%, 80%, 100% { transform: translateY(0); }
          40%, 43% { transform: translateY(-8px); }
          70% { transform: translateY(-4px); }
          90% { transform: translateY(-2px); }
        }

        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }

        @keyframes rotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes balanceGlow {
          0% { text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
          50% { text-shadow: 0 2px 20px rgba(63, 81, 181, 0.4); }
          100% { text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
        }

        /* Responsive */
        @media (max-width: 480px) {
          .balance-amount {
            font-size: 2rem;
          }
          
          .portfolio-stats {
            grid-template-columns: 1fr;
          }
          
          .action-buttons {
            flex-direction: column;
            gap: 0.75rem;
          }
          
          .partner-stats {

                  }, '📢 Канал'),
                  React.createElement('a', { 
                    href: 'https://t.me/ton_stocker_chat', 
                    className: 'footer-link',
                    target: '_blank'
                  }, '💭 Чат')
                )
              )
            ),

            // Bottom Navigation
            React.createElement('nav', { className: 'bottom-nav' },
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'main' ? 'active' : ''}`,
                onClick: () => setActiveScreen('main')
              },
                React.createElement('div', { className: 'nav-icon' }, '🏠'),
                React.createElement('div', { className: 'nav-label' }, 'Главная')
              ),
              
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'portfolio' ? 'active' : ''}`,
                onClick: () => setActiveScreen('portfolio')
              },
                React.createElement('div', { className: 'nav-icon' }, '📊'),
                React.createElement('div', { className: 'nav-label' }, 'Портфель')
              ),
              
              React.createElement('div', {
                className: `nav-item card-nav ${activeScreen === 'card' ? 'active' : ''}`,
                onClick: () => setActiveScreen('card')
              },
                React.createElement('div', { className: 'nav-icon' }, '💳')
              ),
              
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'about' ? 'active' : ''}`,
                onClick: () => setActiveScreen('about')
              },
                React.createElement('div', { className: 'nav-icon' }, 'ℹ️'),
                React.createElement('div', { className: 'nav-label' }, 'О проекте')
              ),
              
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'partners' ? 'active' : ''}`,
                onClick: () => setActiveScreen('partners')
              },
                React.createElement('div', { className: 'nav-icon' }, '👥'),
                React.createElement('div', { className: 'nav-label' }, 'Партнеры')
              )
            )
          );
        };

        // Initialize App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        
        // Handle Telegram WebApp events
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.onEvent('backButtonClicked', () => {
            window.history.back();
          });
        }
    </script>
</body>
</html>
