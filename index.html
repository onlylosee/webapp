<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON STOCKER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Те же стили что были... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a237e;
            --secondary-color: #0d47a1;
            --accent-color: #3f51b5;
            --background-dark: #0a0a0a;
            --surface-dark: #1a1a1a;
            --surface-light: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --success-color: #4caf50;
            --error-color: #f44336;
            --warning-color: #ff9800;
            --border-color: #333333;
            --gradient-primary: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --gradient-card: linear-gradient(145deg, var(--surface-dark), var(--surface-light));
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-bottom: 60px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--background-dark);
            position: relative;
        }

        .header {
            background: var(--gradient-primary);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .content {
            padding: 20px;
        }

        .user-info {
            background: var(--gradient-card);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .user-name {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .balance-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface-dark);
            padding: 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-value.green {
            color: var(--success-color);
        }

        .section {
            background: var(--gradient-card);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .section h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error {
            background: var(--error-color);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .connection-status {
            background: var(--warning-color);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .debug-info {
            background: var(--surface-light);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="logo">TON STOCKER</h1>
        </header>

        <main class="content">
            <div id="content">
                <div class="loading">
                    <h2>Загрузка данных...</h2>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ⚠️ ВАЖНО: Замените на ваш реальный туннель URL
        const API_BASE_URL = 'https://nelia-unhefted-edward.ngrok-free.dev/api';
        // Пример: const API_BASE_URL = 'https://abc123def456.localhost.run/api';

        // Telegram WebApp initialization
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let userData = {
            userId: null,
            balance: 0,
            deposits: [],
            referrals: { level1: 0, level2: 0, level3: 0 }
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            // Получаем user data из Telegram
            if (tg.initDataUnsafe.user) {
                userData.userId = tg.initDataUnsafe.user.id;
                showDebugInfo();
                loadUserData();
            } else {
                // Тестовый режим для отладки
                userData.userId = 123456789; // Замените на существующий ID из вашей БД
                showDebugInfo();
                loadUserData();
            }

            // Настройка главной кнопки Telegram
            tg.MainButton.setText('Обновить данные');
            tg.MainButton.onClick(loadUserData);
            tg.MainButton.show();
        }

        function showDebugInfo() {
            const debugContent = `
                <div class="debug-info">
                    <h3>Отладочная информация:</h3>
                    <p><strong>User ID:</strong> ${userData.userId}</p>
                    <p><strong>API URL:</strong> ${API_BASE_URL}</p>
                    <p><strong>Test URL:</strong> ${API_BASE_URL}/health</p>
                    <p><strong>User URL:</strong> ${API_BASE_URL}/user/${userData.userId}</p>
                    <button onclick="testConnection()" style="background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; margin-top: 10px;">
                        Тест подключения
                    </button>
                </div>
            `;
            
            document.getElementById('content').innerHTML = debugContent + document.getElementById('content').innerHTML;
        }

        async function testConnection() {
            showConnectionStatus('Тестирование соединения...');
            
            try {
                // Тест 1: Проверяем health endpoint
                console.log('Тест 1: Проверка health endpoint');
                const healthResponse = await fetch(`${API_BASE_URL}/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                console.log('Health response status:', healthResponse.status);
                const healthData = await healthResponse.json();
                console.log('Health data:', healthData);
                
                if (healthData.success) {
                    showConnectionStatus(`✅ API работает! Пользователей в БД: ${healthData.users_count}`);
                    
                    // Тест 2: Проверяем пользователя
                    setTimeout(() => {
                        loadUserData();
                    }, 2000);
                } else {
                    throw new Error('Health check failed');
                }
                
            } catch (error) {
                console.error('Connection test failed:', error);
                showConnectionStatus(`❌ Ошибка соединения: ${error.message}`);
                
                // Показываем инструкции
                setTimeout(() => {
                    showConnectionInstructions();
                }, 3000);
            }
        }

        function showConnectionInstructions() {
            const instructions = `
                <div class="error">
                    <h3>Проблема с подключением</h3>
                    <p><strong>Проверьте:</strong></p>
                    <ol style="margin-left: 20px; margin-top: 10px;">
                        <li>API сервер запущен: <code>python api_server.py</code></li>
                        <li>Туннель активен: <code>ssh -R 80:localhost:5000 ssh.localhost.run</code></li>
                        <li>URL в коде совпадает с URL туннеля</li>
                        <li>Файл users.db существует и содержит данные</li>
                    </ol>
                    <button onclick="location.reload()" style="background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; margin-top: 10px;">
                        Перезагрузить
                    </button>
                </div>
            `;
            
            hideConnectionStatus();
            document.getElementById('content').innerHTML = instructions;
        }

    async function loadUserData() {
        showConnectionStatus('Подключение к серверу...');
        
        try {
            if (!userData.userId) {
                throw new Error('ID пользователя не определен');
            }
            
            console.log(`Запрос к: ${API_BASE_URL}/user/${userData.userId}`);
            
            // Добавляем режим no-cors и правильные заголовки
            const response = await fetch(`${API_BASE_URL}/user/${userData.userId}`, {
                method: 'GET',
                mode: 'cors',
                credentials: 'omit' // Не отправляем куки
                // Уберите заголовки Content-Type, Authorization
            });
            // const response = await fetch(`${API_BASE_URL}/user/${userData.userId}`, {
            //     method: 'GET',
            //     mode: 'cors', // Важно: используем cors режим
            //     headers: {
            //         'Content-Type': 'application/json',
            //         'Accept': 'application/json'
            //     },

            // });
            
            console.log('Response status:', response.status);
            console.log('Response ok:', response.ok);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const result = await response.json();
            console.log('API response:', result);
            
            if (result.success) {
                userData = {
                    ...userData,
                    balance: result.data.balance,
                    deposits: result.data.deposits,
                    referrals: result.data.referrals,
                    username: result.data.username,
                    totalInvested: result.data.total_invested,
                    currentProfit: result.data.current_profit,
                    depositsCount: result.data.deposits_count
                };
                
                hideConnectionStatus();
                updateUI();
            } else {
                throw new Error(result.error || 'Ошибка получения данных');
            }
            
        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            hideConnectionStatus();
            
            // Более детальная информация об ошибке
            if (error.name === 'TypeError' && error.message.includes('fetch')) {
                showError('Ошибка сети: проверьте, что API сервер и туннель работают');
            } else {
                showError(`Ошибка: ${error.message}`);
            }
        }
    }


        function updateUI() {
            const content = `
                <div class="user-info">
                    <div class="user-name">Добро пожаловать, ${userData.username || 'Пользователь'}!</div>
                    <div class="balance-amount">₽${userData.balance.toFixed(2)}</div>
                    <p class="balance-subtitle">Доступно для инвестиций</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Всего инвестировано</h3>
                        <p class="stat-value">₽${(userData.totalInvested || 0).toFixed(2)}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Текущая прибыль</h3>
                        <p class="stat-value green">₽${(userData.currentProfit || 0).toFixed(2)}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Депозитов</h3>
                        <p class="stat-value">${userData.depositsCount || 0}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Рефералов</h3>
                        <p class="stat-value">${userData.referrals.level1 + userData.referrals.level2 + userData.referrals.level3}</p>
                    </div>
                </div>

                <div class="section">
                    <h3>Активные депозиты</h3>
                    ${userData.deposits && userData.deposits.length > 0 ? renderDeposits() : '<div class="empty-state"><p>У вас пока нет активных депозитов</p></div>'}
                </div>

                <div class="section">
                    <h3>Партнерская программа</h3>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div style="background: var(--surface-dark); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; border: 1px solid var(--border-color);">
                            <span style="color: var(--text-secondary);">1 уровень (20%)</span>
                            <strong style="color: var(--success-color); font-size: 1.2rem;">${userData.referrals.level1}</strong>
                        </div>
                        <div style="background: var(--surface-dark); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; border: 1px solid var(--border-color);">
                            <span style="color: var(--text-secondary);">2 уровень (3%)</span>
                            <strong style="color: var(--success-color); font-size: 1.2rem;">${userData.referrals.level2}</strong>
                        </div>
                        <div style="background: var(--surface-dark); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; border: 1px solid var(--border-color);">
                            <span style="color: var(--text-secondary);">3 уровень (1%)</span>
                            <strong style="color: var(--success-color); font-size: 1.2rem;">${userData.referrals.level3}</strong>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = content;
        }

        function renderDeposits() {
            return userData.deposits.map(deposit => {
                const startDate = new Date(deposit.start).toLocaleDateString('ru-RU');
                const profit = calculateDepositProfit(deposit);
                
                return `
                    <div style="background: var(--surface-dark); padding: 20px; border-radius: var(--border-radius); border: 1px solid var(--border-color); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h4 style="color: var(--text-primary); margin-bottom: 5px;">Депозит ₽${deposit.amount.toFixed(2)}</h4>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;">Дата: ${startDate}</p>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;">Доходность: 4% в день</p>
                        </div>
                        <div style="text-align: right;">
                            <div style="color: var(--success-color); font-weight: 600; font-size: 1.1rem;">+₽${profit.toFixed(2)}</div>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;">Прибыль</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateDepositProfit(deposit) {
            if (!deposit.start) return 0;
            
            const now = new Date();
            const startTime = new Date(deposit.start);
            const elapsed = now - startTime;
            const elapsedHours = elapsed / (1000 * 60 * 60);
            
            const hourlyProfit = deposit.amount * 0.04 / 24;
            const profit = hourlyProfit * elapsedHours;
            
            const collected = deposit.collected_profit || 0;
            return Math.max(0, profit - collected);
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>Ошибка</h2>
                    <p>${message}</p>
                    <button onclick="loadUserData()" style="background: var(--accent-color); color: white; border: none; padding: 8px 16px; border-radius: 4px; margin-top: 10px;">
                        Повторить попытку
                    </button>
                </div>
            `;
        }

        function showConnectionStatus(message) {
            const existing = document.querySelector('.connection-status');
            if (existing) existing.remove();
            
            const status = document.createElement('div');
            status.className = 'connection-status';
            status.textContent = message;
            document.body.insertBefore(status, document.body.firstChild);
        }

        function hideConnectionStatus() {
            const status = document.querySelector('.connection-status');
            if (status) status.remove();
        }
    </script>
</body>
</html>
