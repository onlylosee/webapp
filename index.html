<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0e27" />
    <title>TON STOCKER</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
          background: #0a0e27;
          color: #ffffff;
          line-height: 1.5;
          overflow-x: hidden;
          -webkit-font-smoothing: antialiased;
          padding-bottom: 80px;
        }

        .app {
          max-width: 500px;
          margin: 0 auto;
          min-height: 100vh;
          background: #0a0e27;
        }

        /* Header */
        .header {
          background: #0f1535;
          padding: 1rem 1.5rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .user-avatar {
          width: 50px;
          height: 50px;
          border-radius: 50%;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.5rem;
          font-weight: 700;
          color: white;
          border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .user-name {
          font-size: 1.1rem;
          font-weight: 600;
        }

        /* Content */
        .content {
          min-height: calc(100vh - 140px);
        }

        .screen {
          display: none;
        }

        .screen.active {
          display: block;
        }

        /* Main Screen */
        .balance-section {
          background: #0f1535;
          padding: 2rem 1.5rem;
          text-align: center;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-label {
          color: rgba(255, 255, 255, 0.5);
          font-size: 0.9rem;
          margin-bottom: 0.5rem;
          text-transform: uppercase;
          letter-spacing: 1px;
        }

        .balance-amount {
          font-size: 3rem;
          font-weight: 700;
          margin-bottom: 1.5rem;
          color: #ffffff;
        }

        .balance-actions {
          display: flex;
          gap: 1rem;
          justify-content: center;
        }

        .btn {
          padding: 0.75rem 2rem;
          border-radius: 12px;
          border: none;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
          font-size: 1rem;
        }

        .btn-primary {
          background: #00d4ff;
          color: #0a0e27;
        }

        .btn-primary:active {
          transform: scale(0.95);
        }

        .btn-secondary {
          background: rgba(255, 255, 255, 0.1);
          color: #ffffff;
        }

        /* Bank Progress */
        .bank-section {
          padding: 1.5rem;
          background: rgba(15, 21, 53, 0.5);
          margin: 1rem;
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bank-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1rem;
        }

        .bank-title {
          font-size: 0.9rem;
          color: rgba(255, 255, 255, 0.7);
        }

        .bank-rate {
          font-size: 1.2rem;
          font-weight: 700;
          color: #00d4ff;
        }

        .progress-bar {
          background: rgba(255, 255, 255, 0.05);
          height: 8px;
          border-radius: 10px;
          overflow: hidden;
          margin-bottom: 0.75rem;
        }

        .progress-fill {
          background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
          height: 100%;
          border-radius: 10px;
          transition: width 0.5s ease;
        }

        .bank-stats {
          display: flex;
          justify-content: space-between;
          font-size: 0.85rem;
        }

        .bank-stats span {
          color: rgba(255, 255, 255, 0.5);
        }

        .bank-stats strong {
          color: #ffffff;
        }

        /* Live Transactions */
        .transactions-section {
          padding: 0 1rem 1rem;
        }

        .section-header {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          padding: 1rem 0.5rem;
          color: rgba(255, 255, 255, 0.7);
          font-size: 0.9rem;
        }

        .live-indicator {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #00ff88;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }

        .transaction-item {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 12px;
          padding: 1rem;
          margin-bottom: 0.75rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .transaction-left {
          flex: 1;
        }

        .transaction-id {
          font-size: 0.85rem;
          color: rgba(255, 255, 255, 0.5);
          margin-bottom: 0.25rem;
        }

        .transaction-type {
          font-size: 0.95rem;
          color: #00d4ff;
          font-weight: 500;
        }

        .transaction-right {
          text-align: right;
        }

        .transaction-date {
          font-size: 0.75rem;
          color: rgba(255, 255, 255, 0.4);
          margin-bottom: 0.25rem;
        }

        .transaction-amount {
          font-size: 1.2rem;
          font-weight: 700;
          color: #ffb800;
        }

        /* Portfolio Screen */
        .portfolio-stats {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
          padding: 1rem;
        }

        .stat-card {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.5rem;
          text-align: center;
        }

        .stat-label {
          font-size: 0.85rem;
          color: rgba(255, 255, 255, 0.5);
          margin-bottom: 0.5rem;
        }

        .stat-value {
          font-size: 1.8rem;
          font-weight: 700;
          color: #ffffff;
        }

        .collect-section {
          padding: 1rem;
        }

        .collect-card {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.5rem;
          text-align: center;
        }

        .collect-amount {
          font-size: 2rem;
          font-weight: 700;
          color: #00ff88;
          margin-bottom: 1rem;
        }

        .collect-btn {
          width: 100%;
          background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
          color: #0a0e27;
          padding: 1rem;
          border-radius: 12px;
          border: none;
          font-size: 1.1rem;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.2s;
        }

        .collect-btn:active {
          transform: scale(0.95);
        }

        .collect-btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
        }

        /* Bottom Navigation - КАК НА СКРИНШОТЕ */
        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          max-width: 500px;
          margin: 0 auto;
          background: #0f1535;
          border-top: 1px solid rgba(255, 255, 255, 0.05);
          display: flex;
          justify-content: space-around;
          padding: 0.5rem 0;
          z-index: 1000;
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.25rem;
          padding: 0.5rem 1rem;
          cursor: pointer;
          transition: all 0.2s;
          min-width: 70px;
          border-radius: 12px;
        }

        .nav-item.active {
          background: rgba(0, 212, 255, 0.1);
        }

        .nav-icon {
          font-size: 1.5rem;
          color: rgba(255, 255, 255, 0.5);
          transition: all 0.2s;
        }

        .nav-item.active .nav-icon {
          color: #00d4ff;
        }

        .nav-label {
          font-size: 0.7rem;
          color: rgba(255, 255, 255, 0.5);
          font-weight: 500;
        }

        .nav-item.active .nav-label {
          color: #00d4ff;
        }

        /* Card Screen */
        .card-display {
          margin: 1rem;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          border-radius: 20px;
          padding: 2rem;
          color: white;
          position: relative;
          overflow: hidden;
        }

        .card-display::before {
          content: '';
          position: absolute;
          top: -50%;
          right: -50%;
          width: 200%;
          height: 200%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
          animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        .card-balance {
          font-size: 2.5rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
          position: relative;
          z-index: 1;
        }

        .card-label {
          opacity: 0.8;
          position: relative;
          z-index: 1;
        }

        /* Calculator */
        .calculator-section {
          padding: 1rem;
        }

        .calculator-card {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.5rem;
        }

        .calc-title {
          font-size: 1.1rem;
          font-weight: 600;
          margin-bottom: 1rem;
        }

        .calc-input {
          width: 100%;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 12px;
          padding: 1rem;
          color: #ffffff;
          font-size: 1.1rem;
          margin-bottom: 1rem;
        }

        .calc-input:focus {
          outline: none;
          border-color: #00d4ff;
        }

        .calc-result {
          text-align: center;
          padding: 1rem;
          background: rgba(0, 255, 136, 0.1);
          border-radius: 12px;
          color: #00ff88;
          font-size: 1.2rem;
          font-weight: 600;
        }

        /* About & Partners */
        .info-section {
          padding: 1rem;
        }

        .info-card {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.5rem;
          margin-bottom: 1rem;
        }

        .info-title {
          font-size: 1.2rem;
          font-weight: 600;
          margin-bottom: 1rem;
        }

        .info-text {
          color: rgba(255, 255, 255, 0.7);
          line-height: 1.7;
          margin-bottom: 1rem;
        }

        .feature-list {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }

        .feature-item {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        .feature-icon {
          width: 50px;
          height: 50px;
          border-radius: 12px;
          background: rgba(0, 212, 255, 0.1);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.5rem;
        }

        .feature-content h4 {
          margin-bottom: 0.25rem;
        }

        .feature-content p {
          font-size: 0.9rem;
          color: rgba(255, 255, 255, 0.5);
        }

        /* Partner Stats */
        .partner-stats {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
          margin-bottom: 1rem;
        }

        .partner-stat-card {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.5rem;
          text-align: center;
        }

        .partner-value {
          font-size: 2rem;
          font-weight: 700;
          color: #00d4ff;
          margin-bottom: 0.5rem;
        }

        .partner-label {
          font-size: 0.9rem;
          color: rgba(255, 255, 255, 0.5);
        }

        /* Level System */
        .level-list {
          display: flex;
          flex-direction: column;
          gap: 1rem;
        }

        .level-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background: rgba(255, 255, 255, 0.03);
          border-radius: 12px;
        }

        .level-name {
          font-weight: 600;
        }

        .level-desc {
          font-size: 0.85rem;
          color: rgba(255, 255, 255, 0.5);
        }

        .level-rate {
          font-size: 1.5rem;
          font-weight: 700;
          color: #ffb800;
        }

        /* Referral Link */
        .ref-link-section {
          background: rgba(15, 21, 53, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.5rem;
        }

        .ref-code {
          background: rgba(0, 0, 0, 0.3);
          padding: 1rem;
          border-radius: 12px;
          font-family: monospace;
          font-size: 0.9rem;
          color: #00d4ff;
          word-break: break-all;
          margin-bottom: 1rem;
        }

        .copy-link-btn {
          width: 100%;
          background: #00d4ff;
          color: #0a0e27;
          padding: 1rem;
          border-radius: 12px;
          border: none;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
        }

        .copy-link-btn:active {
          transform: scale(0.95);
        }

        /* Footer Links */
        .footer-links {
          display: flex;
          justify-content: center;
          gap: 2rem;
          padding: 1.5rem;
          margin-top: 1rem;
        }

        .footer-link {
          color: #00d4ff;
          text-decoration: none;
          font-weight: 500;
        }

        /* Empty State */
        .empty-state {
          text-align: center;
          padding: 3rem 1rem;
          color: rgba(255, 255, 255, 0.5);
        }

        .empty-icon {
          font-size: 3rem;
          margin-bottom: 1rem;
        }

        /* Loading */
        .loading {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          flex-direction: column;
          gap: 1rem;
        }

        .spinner {
          width: 50px;
          height: 50px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-top: 3px solid #00d4ff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
          .balance-amount {
            font-size: 2.5rem;
          }
          
          .portfolio-stats {
            grid-template-columns: 1fr;
          }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div style="font-size: 4rem;">🚀</div>
            <div class="spinner"></div>
            <div>Загрузка...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_BASE_URL = 'https://server-3hznro02y-onlylosees-projects.vercel.app/api';
        const USDT_TO_RUB = 95;

        const App = () => {
          const [userData, setUserData] = useState(null);
          const [globalTransactions, setGlobalTransactions] = useState([]);
          const [projectBank, setProjectBank] = useState({ invested: 0, target: 100000, rate: 5.0, progress: 0 });
          const [loading, setLoading] = useState(true);
          const [activeScreen, setActiveScreen] = useState('main');
          const [calcAmount, setCalcAmount] = useState('');

          useEffect(() => {
            const init = async () => {
              try {
                let userId = 652017464;
                
                if (window.Telegram?.WebApp) {
                  const tg = window.Telegram.WebApp;
                  tg.ready();
                  tg.expand();
                  tg.setBackgroundColor('#0a0e27');
                  userId = tg.initDataUnsafe?.user?.id || 652017464;
                }
                
                await loadData(userId);
                
                // Auto refresh every 10 seconds for live effect
                const interval = setInterval(() => loadData(userId), 10000);
                return () => clearInterval(interval);
                
              } catch (err) {
                console.error('Init error:', err);
                setLoading(false);
              }
            };

            init();
          }, []);

          const loadData = async (userId) => {
            try {
              // Load user data
              const userRes = await axios.get(`${API_BASE_URL}/user/${userId}`);
              if (userRes.data.success) {
                setUserData(userRes.data.data);
              }

              // Load global stats for project bank
              const statsRes = await axios.get(`${API_BASE_URL}/admin/stats`);
              if (statsRes.data.success) {
                const stats = statsRes.data.data;
                const totalInvested = stats.total_invested * USDT_TO_RUB;
                
                let rate = 5.0;
                let target = 100000;
                let progress = 0;
                
                if (totalInvested >= 750000) {
                  rate = 8.6;
                  target = 750000;
                  progress = 100;
                } else if (totalInvested >= 250000) {
                  rate = 7.4;
                  target = 750000;
                  progress = (totalInvested / 750000) * 100;
                } else if (totalInvested >= 100000) {
                  rate = 6.2;
                  target = 250000;
                  progress = (totalInvested / 250000) * 100;
                } else {
                  progress = (totalInvested / 100000) * 100;
                }
                
                setProjectBank({
                  invested: totalInvested,
                  target: target,
                  rate: rate,
                  progress: Math.min(progress, 100)
                });

                // Create mock global transactions from all users (last 10)
                const mockTransactions = [];
                for (let i = 0; i < 10; i++) {
                  const randomAmount = [396.84, 25, 500, 1000, 13.2, 250, 750, 100, 50, 150][i] || Math.floor(Math.random() * 1000);
                  mockTransactions.push({
                    id: `${990678310 + i}`,
                    type: 'Пополнение баланса',
                    amount: randomAmount,
                    date: new Date(Date.now() - i * 60000).toLocaleString('ru-RU', {
                      day: '2-digit',
                      month: '2-digit',
                      year: '2-digit',
                      hour: '2-digit',
                      minute: '2-digit'
                    })
                  });
                }
                setGlobalTransactions(mockTransactions);
              }

              setLoading(false);
            } catch (err) {
              console.error('Load data error:', err);
              setLoading(false);
            }
          };

          const collectProfit = async () => {
            if (!userData || userData.current_profit <= 0) {
              alert('Нет доступной прибыли');
              return;
            }

            try {
              const res = await axios.post(`${API_BASE_URL}/user/${userData.user_id}/collect-profit`);
              if (res.data.success) {
                await loadData(userData.user_id);
                alert(`🎉 Собрано ${formatMoney(res.data.amount * USDT_TO_RUB)}!`);
              }
            } catch (err) {
              alert('Ошибка сбора прибыли');
            }
          };

          const formatMoney = (amount) => {
            return new Intl.NumberFormat('ru-RU', {
              style: 'decimal',
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }).format(amount) + 'P';
          };

          const calculateProfit = (amount) => {
            return amount * (projectBank.rate / 100);
          };

          if (loading) {
            return React.createElement('div', { className: 'loading' },
              React.createElement('div', { style: { fontSize: '4rem' } }, '🚀'),
              React.createElement('div', { className: 'spinner' }),
              React.createElement('div', null, 'Загрузка...')
            );
          }

          const userName = userData?.user_id ? `onlylose?` : 'User';
          const userInitial = userName.charAt(0).toUpperCase();

          return React.createElement('div', { className: 'app' },
            
            // Header
            React.createElement('header', { className: 'header' },
              React.createElement('div', { className: 'user-info' },
                React.createElement('div', { className: 'user-avatar' }, userInitial),
                React.createElement('div', { className: 'user-name' }, userName)
              )
            ),

            // Content
            React.createElement('div', { className: 'content' },
              
              // Main Screen
              React.createElement('div', { className: `screen ${activeScreen === 'main' ? 'active' : ''}` },
                // Balance Section
                React.createElement('div', { className: 'balance-section' },
                  React.createElement('div', { className: 'balance-label' }, 'Всего активов (RUB)'),
                  React.createElement('div', { className: 'balance-amount' },
                    formatMoney((userData?.balance || 0) * USDT_TO_RUB).replace('P', '')
                  ),
                  React.createElement('div', { className: 'balance-actions' },
                    React.createElement('button', { className: 'btn btn-primary' }, 'Пополнить')
                  )
                ),
                
                // Bank Progress
                React.createElement('div', { className: 'bank-section' },
                  React.createElement('div', { className: 'bank-header' },
                    React.createElement('div', { className: 'bank-title' }, '🏦 Банк проекта'),
                    React.createElement('div', { className: 'bank-rate' }, `${projectBank.rate}% в день`)
                  ),
                  React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', { 
                      className: 'progress-fill',
                      style: { width: `${projectBank.progress}%` }
                    })
                  ),
                  React.createElement('div', { className: 'bank-stats' },
                    React.createElement('span', null, 
                      'Инвестировано: ',
                      React.createElement('strong', null, formatMoney(projectBank.invested))
                    ),
                    React.createElement('span', null, 
                      'Цель: ',
                      React.createElement('strong', null, formatMoney(projectBank.target))
                    )
                  )
                ),
                
                // Live Transactions
                React.createElement('div', { className: 'transactions-section' },
                  React.createElement('div', { className: 'section-header' },
                    React.createElement('div', { className: 'live-indicator' }),
                    'Live Транзакции'
                  ),
                  globalTransactions.map(tx =>
                    React.createElement('div', { key: tx.id, className: 'transaction-item' },
                      React.createElement('div', { className: 'transaction-left' },
                        React.createElement('div', { className: 'transaction-id' }, `ID:${tx.id}`),
                        React.createElement('div', { className: 'transaction-type' }, tx.type)
                      ),
                      React.createElement('div', { className: 'transaction-right' },
                        React.createElement('div', { className: 'transaction-date' }, tx.date),
                        React.createElement('div', { className: 'transaction-amount' }, `+${tx.amount}P`)
                      )
                    )
                  )
                )
              ),

              // Portfolio Screen
