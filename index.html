<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>TON STOCKER - Investment Platform</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        /* TON STOCKER v3 - Modern Design with Bottom Navigation */
        :root {
      --primary: #3f51b5;
      --primary-light: #5c6bc0;
      --primary-dark: #1a237e;
      --secondary: #00bcd4;
      --success: #4caf50;
      --success-light: #81c784;
      --warning: #ff9800;
      --error: #f44336;
      --info: #2196f3;

      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-card: #1e1e1e;
      --bg-elevated: #2a2a2a;

      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --text-muted: #666666;

      --border: #333333;
      --border-light: #404040;

      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      --gradient-primary: linear-gradient(135deg, var(--primary), var(--primary-dark));
      --gradient-success: linear-gradient(135deg, var(--success), #388e3c);
      --gradient-card: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));

      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: all 0.15s ease-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg-primary);
      position: relative;
      overflow-x: hidden;
    }

    /* === LOADING SCREEN === */
    .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    .loading-logo {
      font-size: 4rem;
      animation: bounce 1s ease-in-out infinite;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-content h2 {
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-content p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* === ERROR SCREEN === */
    .error-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .error-content {
      text-align: center;
      max-width: 400px;
    }

    .error-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: shake 0.5s ease-in-out;
    }

    .error-content h2 {
      margin-bottom: 1rem;
      color: var(--error);
      font-size: 1.5rem;
    }

    .error-message {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--error);
    }

    .retry-button {
      background: var(--gradient-primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-md);
    }

    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    /* === NOTIFICATIONS === */
    .notification {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
      font-weight: 500;
      z-index: 9999;
      animation: slideInDown 0.3s ease-out;
    }

    .notification.success {
      background: rgba(76, 175, 80, 0.95);
      border-left: 4px solid var(--success);
    }

    .notification.error {
      background: rgba(244, 67, 54, 0.95);
      border-left: 4px solid var(--error);
    }

    .notification.info {
      background: rgba(33, 150, 243, 0.95);
      border-left: 4px solid var(--info);
    }

    .notification-content {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* === HEADER === */
    .app-header {
      background: var(--gradient-primary);
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .app-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      line-height: 1;
    }

    .app-subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
      margin-top: 0.25rem;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 0.75rem;
      border-radius: 50%;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .refresh-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(180deg);
    }

    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* === BALANCE CARD === */
    .balance-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      animation: shimmer 3s infinite;
    }

    .balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.9rem;
    }

    .balance-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-fast);
      font-size: 1rem;
    }

    .balance-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .balance-amount {
      font-size: 3rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .profit-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(76, 175, 80, 0.2);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: var(--success-light);
      font-size: 0.9rem;
      font-weight: 500;
      animation: pulse 2s ease-in-out infinite;
    }

    .profit-icon {
      font-size: 1.2rem;
      animation: bounce 1s ease-in-out infinite;
    }

    /* === QUICK ACTIONS === */
    .quick-actions {
      display: flex;
      gap: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      border: none;
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      text-align: left;
      box-shadow: var(--shadow-md);
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: all 0.6s ease;
    }

    .action-btn:active::before {
      width: 300px;
      height: 300px;
    }

    .collect-btn {
      background: var(--gradient-success);
      color: white;
    }

    .collect-btn.disabled {
      background: var(--bg-elevated);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .invest-btn {
      background: var(--gradient-primary);
      color: white;
    }

    .action-btn:hover:not(.disabled) {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .btn-icon {
      font-size: 2rem;
      flex-shrink: 0;
    }

    .btn-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .btn-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .btn-amount, .btn-subtitle {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 500;
    }

    /* === SECTIONS === */
    section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* === STATS GRID === */
    .stats-section {
      padding: 0 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .stat-card {
      background: var(--gradient-card);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.6s ease;
    }

    .stat-card:hover::before {
      transform: scale(1);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary-light);
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .stat-icon.invested {
      background: rgba(33, 150, 243, 0.2);
      color: var(--info);
    }

    .stat-icon.earned {
      background: rgba(76, 175, 80, 0.2);
      color: var(--success);
    }

    .stat-icon.deposits {
      background: rgba(156, 39, 176, 0.2);
      color: #ab47bc;
    }

    .stat-icon.referrals {
      background: rgba(255, 152, 0, 0.2);
      color: var(--warning);
    }

    .stat-info {
      flex: 1;
      z-index: 1;
      position: relative;
    }

    .stat-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    /* === PERFORMANCE SECTION === */
    .performance-section {
      padding: 0 1.5rem;
    }

    .performance-card {
      background: var(--gradient-card);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .performance-stats {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .perf-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    .perf-item:last-child {
      border-bottom: none;
    }

    .perf-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .perf-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .perf-value.positive {
      color: var(--success);
    }

    .perf-value.status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    .perf-value.status.active {
      color: var(--success);
    }

    /* === TRANSACTIONS SECTION === */
    .transactions-section {
      padding: 0 1.5rem;
    }

    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem;
      background: var(--gradient-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .transaction-item:hover {
      transform: translateX(8px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

    .tx-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      border: 1px solid var(--border-light);
    }

    .tx-info {
      flex: 1;
    }

    .tx-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    .tx-description {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
      line-height: 1.3;
    }

    .tx-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .tx-amount {
      font-weight: 700;
      font-size: 1rem;
      text-align: right;
    }

    .tx-amount.positive {
      color: var(--success);
    }

    .tx-amount.negative {
      color: var(--error);
    }

    .empty-transactions {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    .empty-transactions p {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .empty-transactions small {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* === REFERRAL SECTION === */
    .referral-section {
      padding: 0 1.5rem;
    }

    .referral-card {
      background: var(--gradient-card);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }

    .referral-subtitle {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .referral-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      background: var(--bg-elevated);
      padding: 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
    }

    .ref-stat {
      text-align: center;
      flex: 1;
    }

    .ref-count {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-light);
      margin-bottom: 0.25rem;
    }

    .ref-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .referral-earnings {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(76, 175, 80, 0.1);
      border-radius: var(--radius-md);
      border: 1px solid rgba(76, 175, 80, 0.2);
      margin-bottom: 1.5rem;
    }

    .earnings-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .earnings-amount {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--success);
    }

    .referral-link {
      background: var(--bg-elevated);
      padding: 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
    }

    .link-header {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .link-container {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .ref-code {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--primary-light);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .copy-btn {
      background: var(--gradient-primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition-fast);
      white-space: nowrap;
    }

    .copy-btn:hover {
      transform: scale(1.05);
    }

    /* === FOOTER === */
    .app-footer {
      margin-top: 3rem;
      padding: 2rem 1.5rem;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }

    .footer-content {
      text-align: center;
      color: var(--text-muted);
    }

    .footer-content p {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .footer-links span {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* === ANIMATIONS === */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 20%, 53%, 80%, 100% { transform: translateY(0); }
      40%, 43% { transform: translateY(-8px); }
      70% { transform: translateY(-4px); }
      90% { transform: translateY(-2px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes slideInDown {
      from {
        transform: translate(-50%, -100%);
        opacity: 0;
      }
      to {
        transform: translate(-50%, 0);
        opacity: 1;
      }
    }

    @keyframes slideInRight {
      from {
        transform: translateX(30px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @keyframes balanceGlow {
      0% { text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
      50% { text-shadow: 0 2px 20px rgba(63, 81, 181, 0.4); }
      100% { text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
    }

    /* === RESPONSIVE DESIGN === */
    @media (max-width: 480px) {
      .balance-amount {
        font-size: 2.5rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .quick-actions {
        flex-direction: column;
        gap: 0.75rem;
      }

      .action-btn {
        padding: 1.25rem;
      }

      .btn-icon {
        font-size: 1.75rem;
      }

      .app-title {
        font-size: 1.5rem;
      }

      .referral-stats {
        flex-direction: column;
        gap: 1rem;
      }

                  React.createElement('a', { 
                    href: 'https://t.me/ton_stocker_channel', 
                    className: 'footer-link' 
                  }, '📢 Канал'),
                  React.createElement('a', { 
                    href: 'https://t.me/ton_stocker_chat', 
                    className: 'footer-link' 
                  }, '💭 Чат')
                )
              )
            ),

            // Bottom Navigation
            React.createElement('nav', { className: 'bottom-nav' },
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'main' ? 'active' : ''}`,
                onClick: () => setActiveScreen('main')
              },
                React.createElement('div', { className: 'nav-icon' }, '🏠'),
                React.createElement('div', { className: 'nav-label' }, 'Главная')
              ),
              
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'portfolio' ? 'active' : ''}`,
                onClick: () => setActiveScreen('portfolio')
              },
                React.createElement('div', { className: 'nav-icon' }, '📊'),
                React.createElement('div', { className: 'nav-label' }, 'Портфель')
              ),
              
              React.createElement('div', {
                className: `nav-item card-nav ${activeScreen === 'card' ? 'active' : ''}`,
                onClick: () => setActiveScreen('card')
              },
                React.createElement('div', { className: 'nav-icon' }, '💳')
              ),
              
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'about' ? 'active' : ''}`,
                onClick: () => setActiveScreen('about')
              },
                React.createElement('div', { className: 'nav-icon' }, 'ℹ️'),
                React.createElement('div', { className: 'nav-label' }, 'О проекте')
              ),
              
              React.createElement('div', {
                className: `nav-item ${activeScreen === 'partners' ? 'active' : ''}`,
                onClick: () => setActiveScreen('partners')
              },
                React.createElement('div', { className: 'nav-icon' }, '👥'),
                React.createElement('div', { className: 'nav-label' }, 'Партнеры')
              )
            )
          );
        };

        // Initialize App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        
        // Handle Telegram WebApp events
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.onEvent('backButtonClicked', () => {
            window.history.back();
          });
        }
    </script>
</body>
</html>
