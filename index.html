<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B1E4E" />
    <title>TON STOCKER</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <!-- Anime.js для анимации navbar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <!-- Box Icons для navbar -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0B1E4E;
            --primary: #1F3BBB;
            --primary-light: #4F70F9;
            --secondary: #13DEDE;
            --success: #27D94B;
            --warning: #FFD942;
            --error: #FF416C;
            --bg-primary: var(--primary-dark);
            --bg-secondary: #102251;
            --bg-card: #162D7B;
            --text-primary: #E7EFFF;
            --text-secondary: #A6B8FF;
            --text-muted: #7891C3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
        }

        /* Header */
        .header {
            background: #1a1a1a;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(59, 130, 246, 0.5);
        }

        .user-name {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .refresh-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-btn:active {
            transform: rotate(180deg);
            background: rgba(59, 130, 246, 0.25);
        }

        /* Content */
        .content {
            min-height: calc(100vh - 140px);
            padding-bottom: 2rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Balance Section */
        .balance-section {
            padding: 1.5rem;
        }

        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .balance-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .balance-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
        }

        .balance-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            line-height: 1;
        }

        .balance-large {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
        }

        .balance-large .balance-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .balance-large .balance-amount {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .btn-deposit {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Portfolio Stats */
        .portfolio-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            padding: 1.5rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3b82f6;
        }

        /* НОВЫЙ BOTTOM NAVBAR ИЗ ФАЙЛОВ STYLES.CSS */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 0;
            background: #1a1a1a;
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 0 30px 0 rgba(59, 130, 246, 0.3);
            z-index: 1000;
        }

        .navbar button {
            cursor: pointer;
            width: 60px;
            height: 50px;
            border-radius: 20px;
            background: transparent;
            transition: all 0.3s ease;
            border: none;
            position: relative;
        }

        .navbar button i {
            font-size: 1.5rem;
            pointer-events: none;
            color: #7891C3;
            transition: all 0.3s ease;
        }

        .navbar button.plus {
            height: 60px;
            color: #fff;
            background: #3b82f6;
            border-radius: 50%;
            margin-top: -50px;
            box-shadow: 0 10px 20px 0 rgba(59, 130, 246, 0.6);
        }

        .navbar button.plus:hover {
            transform: translateY(-4px);
        }

        .navbar button.plus i {
            color: #fff;
            font-size: 1.8rem;
        }

        .navbar button.active {
            color: #3b82f6;
        }

        .navbar button.active i {
            color: #3b82f6;
        }

        .navbar button.active:not(.plus) {
            transform: scale(1.2);
        }

        .navbar .effect {
            position: absolute;
            width: 60px;
            height: 50px;
            border-radius: 18px;
            background: rgba(59, 130, 246, 0.15);
            opacity: 0;
            transition: all 0.6s ease;
        }

        /* Footer Info */
        .footer-info {
            padding: 2rem 1.5rem 1.5rem;
            margin-top: 2rem;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .footer-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .crypto-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .crypto-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-size: 1.5rem;
        }

        .footer-copyright {
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            padding: 1rem 0;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 1rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="root">
        <div class="loading">
            <div style="font-size: 4rem;">🚀</div>
            <div class="spinner"></div>
            <div style="color: #94a3b8;">Загрузка TON STOCKER...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE_URL = 'https://server-3hznro02y-onlylosees-projects.vercel.app/api';
        const USDT_TO_RUB = 95;

        const App = () => {
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeScreen, setActiveScreen] = useState('main');
            const [refreshing, setRefreshing] = useState(false);

            const formatMoney = amount => {
                return new Intl.NumberFormat('ru-RU', {
                    style: 'decimal',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }).format(amount) + 'Р';
            };

            useEffect(() => {
                setTimeout(() => setLoading(false), 1500);
            }, []);

            if (loading) {
                return React.createElement('div', { className: 'loading' },
                    React.createElement('div', { style: { fontSize: '4rem' } }, '🚀'),
                    React.createElement('div', { className: 'spinner' }),
                    React.createElement('div', { style: { color: '#94a3b8' } }, 'Загрузка...')
                );
            }

            const FooterInfo = () => React.createElement('div', { className: 'footer-info' },
                React.createElement('div', { className: 'footer-links' },
                    React.createElement('a', { href: '#', className: 'footer-link' }, '🎧 Поддержка'),
                    React.createElement('a', { href: '#', className: 'footer-link' }, '✈️ Канал'),
                    React.createElement('a', { href: '#', className: 'footer-link' }, '💬 Чат')
                ),
                React.createElement('div', { className: 'crypto-icons' },
                    React.createElement('div', { className: 'crypto-icon' }, '₿'),
                    React.createElement('div', { className: 'crypto-icon' }, '₮'),
                    React.createElement('div', { className: 'crypto-icon' }, '💎'),
                    React.createElement('div', { className: 'crypto-icon' }, 'Ξ')
                ),
                React.createElement('div', { className: 'footer-copyright' }, '© 2025 | Все права защищены.')
            );

            return React.createElement('div', { className: 'app' },
                React.createElement('header', { className: 'header' },
                    React.createElement('div', { className: 'user-info' },
                        React.createElement('div', { className: 'user-avatar' }, 'O'),
                        React.createElement('div', { className: 'user-name' }, 'onlylose?')
                    ),
                    React.createElement('button', {
                        className: 'refresh-btn',
                        onClick: () => {},
                        disabled: refreshing
                    }, '🔄')
                ),

                React.createElement('div', { className: 'content' },
                    // Главная страница
                    React.createElement('div', { className: `screen ${activeScreen === 'main' ? 'active' : ''}` },
                        React.createElement('div', { className: 'balance-section' },
                            React.createElement('div', { className: 'balance-grid' },
                                React.createElement('div', { className: 'balance-card balance-large' },
                                    React.createElement('div', { className: 'balance-label' }, 'Всего активов (RUB)'),
                                    React.createElement('div', { className: 'balance-amount' }, '0,00'),
                                    React.createElement('button', {
                                        className: 'btn-deposit',
                                        onClick: () => alert('Пополнение скоро!')
                                    }, '💰 Пополнить')
                                ),
                                React.createElement('div', { className: 'balance-card' },
                                    React.createElement('div', { className: 'balance-label' }, 'Прибыль'),
                                    React.createElement('div', { className: 'balance-amount' }, '0,00')
                                ),
                                React.createElement('div', { className: 'balance-card' },
                                    React.createElement('div', { className: 'balance-label' }, 'Инвестировано'),
                                    React.createElement('div', { className: 'balance-amount' }, '0,00')
                                )
                            )
                        ),
                        React.createElement(FooterInfo)
                    ),

                    // Портфель
                    React.createElement('div', { className: `screen ${activeScreen === 'portfolio' ? 'active' : ''}` },
                        React.createElement('div', { className: 'portfolio-stats' },
                            React.createElement('div', { className: 'stat-card' },
                                React.createElement('div', { className: 'stat-label' }, 'Ваш депозит'),
                                React.createElement('div', { className: 'stat-value' }, '0Р')
                            ),
                            React.createElement('div', { className: 'stat-card' },
                                React.createElement('div', { className: 'stat-label' }, 'Доходность'),
                                React.createElement('div', { className: 'stat-value' }, '5.0%')
                            )
                        ),
                        React.createElement(FooterInfo)
                    ),

                    // Карта
                    React.createElement('div', { className: `screen ${activeScreen === 'card' ? 'active' : ''}` },
                        React.createElement('div', { style: { padding: '2rem', textAlign: 'center' } },
                            React.createElement('h2', null, '💳 Карта'),
                            React.createElement('p', { style: { color: '#94a3b8', marginTop: '1rem' } }, 'Функции карты в разработке')
                        ),
                        React.createElement(FooterInfo)
                    ),

                    // О проекте
                    React.createElement('div', { className: `screen ${activeScreen === 'about' ? 'active' : ''}` },
                        React.createElement('div', { style: { padding: '2rem', textAlign: 'center' } },
                            React.createElement('h2', null, '💎 О проекте'),
                            React.createElement('p', { style: { color: '#94a3b8', marginTop: '1rem' } }, 'TON STOCKER - современная инвестиционная платформа')
                        ),
                        React.createElement(FooterInfo)
                    ),

                    // Партнёры
                    React.createElement('div', { className: `screen ${activeScreen === 'partners' ? 'active' : ''}` },
                        React.createElement('div', { style: { padding: '2rem', textAlign: 'center' } },
                            React.createElement('h2', null, '👥 Партнёры'),
                            React.createElement('p', { style: { color: '#94a3b8', marginTop: '1rem' } }, 'Партнерская программа с доходностью до 21%')
                        ),
                        React.createElement(FooterInfo)
                    )
                ),

                // НОВЫЙ NAVBAR С ПОДХОДЯЩИМИ ИКОНКАМИ
                React.createElement('div', { className: 'navbar' },
                    React.createElement('div', { className: 'effect' }),
                    
                    // Главная (Дом)
                    React.createElement('button', {
                        className: activeScreen === 'main' ? 'active' : '',
                        onClick: () => setActiveScreen('main')
                    }, React.createElement('i', { className: 'bx bx-home-alt-2' })),
                    
                    // Портфель (Кошелек)
                    React.createElement('button', {
                        className: activeScreen === 'portfolio' ? 'active' : '',
                        onClick: () => setActiveScreen('portfolio')
                    }, React.createElement('i', { className: 'bx bx-wallet' })),
                    
                    // Центральная кнопка - Карта (Плюс)
                    React.createElement('button', {
                        className: 'plus',
                        onClick: () => setActiveScreen('card')
                    }, React.createElement('i', { className: 'bx bx-credit-card' })),
                    
                    // О проекте (Информация)
                    React.createElement('button', {
                        className: activeScreen === 'about' ? 'active' : '',
                        onClick: () => setActiveScreen('about')
                    }, React.createElement('i', { className: 'bx bx-info-circle' })),
                    
                    // Партнёры (Группа людей)
                    React.createElement('button', {
                        className: activeScreen === 'partners' ? 'active' : '',
                        onClick: () => setActiveScreen('partners')
                    }, React.createElement('i', { className: 'bx bx-group' }))
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>

    <!-- Navbar Animation Script -->
    <script>
        setTimeout(() => {
            const effect = document.querySelector(".effect");
            const buttons = document.querySelectorAll(".navbar button:not(.plus)");

            buttons.forEach((button) => {
                button.addEventListener("click", (e) => {
                    const x = e.target.offsetLeft;
                    buttons.forEach((btn) => {
                        btn.classList.remove("active");
                    });
                    e.target.classList.add("active");

                    if (typeof anime !== 'undefined') {
                        anime({
                            targets: ".effect",
                            left: `${x}px`,
                            opacity: 1,
                            duration: 600,
                        });
                    }
                });
            });
        }, 1000);
    </script>
</body>
</html>
