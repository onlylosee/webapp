<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>TON STOCKER - Investment Platform</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        /* TON STOCKER v3 - Modern Design with Bottom Navigation */
        :root {
          --primary: #6C5CE7;
          --primary-dark: #5A4FCF;
          --secondary: #A29BFE;
          --accent: #FDCB6E;
          --success: #00B894;
          --error: #E17055;
          --warning: #F39C12;
          
          --bg-primary: #0F0F0F;
          --bg-secondary: #1A1A1A;
          --bg-card: #222222;
          --bg-elevated: #2D2D2D;
          
          --text-primary: #FFFFFF;
          --text-secondary: #B0B0B0;
          --text-muted: #666666;
          
          --border: #333333;
          --border-light: #444444;
          
          --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
          --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
          
          --radius: 16px;
          --radius-lg: 24px;
          
          --gradient-primary: linear-gradient(135deg, var(--primary), var(--primary-dark));
          --gradient-card: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
          --gradient-success: linear-gradient(135deg, var(--success), #00A085);
          
          --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
          background: var(--bg-primary);
          color: var(--text-primary);
          line-height: 1.6;
          overflow-x: hidden;
          -webkit-font-smoothing: antialiased;
          padding-bottom: 80px; /* Space for bottom nav */
        }

        .app {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }

        /* Loading */
        .loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          flex-direction: column;
          gap: 2rem;
        }

        .loading-logo {
          font-size: 4rem;
          animation: pulse 2s ease-in-out infinite;
        }

        .loading-spinner {
          width: 50px;
          height: 50px;
          border: 3px solid var(--border);
          border-top: 3px solid var(--primary);
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        /* Header */
        .header {
          position: sticky;
          top: 0;
          z-index: 100;
          background: var(--bg-secondary);
          backdrop-filter: blur(20px);
          border-bottom: 1px solid var(--border);
          padding: 1rem 1.5rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .header h1 {
          font-size: 1.5rem;
          font-weight: 700;
          background: var(--gradient-primary);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
          background: var(--bg-elevated);
          border: 1px solid var(--border);
          color: var(--text-primary);
          padding: 0.75rem;
          border-radius: 12px;
          cursor: pointer;
          transition: var(--transition);
          font-size: 1.2rem;
        }

        .refresh-btn:hover {
          background: var(--primary);
          transform: scale(1.05);
        }

        /* Content Area */
        .content {
          flex: 1;
          padding: 0 0 80px 0; /* Bottom padding for nav */
        }

        .screen {
          display: none;
          padding: 1rem;
          animation: fadeIn 0.3s ease-out;
        }

        .screen.active {
          display: block;
        }

        /* Cards */
        .card {
          background: var(--gradient-card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 1.5rem;
          margin-bottom: 1rem;
          box-shadow: var(--shadow);
          transition: var(--transition);
        }

        .card:hover {
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg);
        }

        .card-title {
          font-size: 1.2rem;
          font-weight: 700;
          margin-bottom: 1rem;
          color: var(--text-primary);
        }

        /* Main Screen */
        .balance-card {
          background: var(--gradient-primary);
          color: white;
          text-align: center;
          margin-bottom: 1.5rem;
        }

        .balance-amount {
          font-size: 2.5rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
        }

        .balance-label {
          opacity: 0.9;
          font-size: 1rem;
        }

        .action-buttons {
          display: flex;
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        .action-btn {
          flex: 1;
          background: var(--bg-card);
          border: 1px solid var(--border);
          color: var(--text-primary);
          padding: 1rem;
          border-radius: var(--radius);
          cursor: pointer;
          transition: var(--transition);
          font-weight: 600;
        }

        .action-btn:hover {
          background: var(--primary);
          transform: translateY(-2px);
        }

        /* Project Bank */
        .project-bank-card {
          background: var(--gradient-success);
          color: white;
          margin-bottom: 1rem;
        }

        .progress-bar {
          background: rgba(255, 255, 255, 0.2);
          border-radius: 10px;
          height: 20px;
          margin: 1rem 0;
          overflow: hidden;
        }

        .progress-fill {
          background: rgba(255, 255, 255, 0.8);
          height: 100%;
          border-radius: 10px;
          transition: width 1s ease;
          position: relative;
        }

        .progress-fill::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
          animation: shimmer 2s infinite;
        }

        /* Live Transactions */
        .transactions-live {
          background: var(--bg-card);
          border-radius: var(--radius);
          padding: 1rem;
          border: 1px solid var(--border);
          max-height: 300px;
          overflow-y: auto;
        }

        .transaction-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0.75rem 0;
          border-bottom: 1px solid var(--border);
        }

        .transaction-item:last-child {
          border-bottom: none;
        }

        .transaction-info {
          display: flex;
          flex-direction: column;
        }

        .transaction-type {
          font-weight: 600;
          margin-bottom: 0.25rem;
        }

        .transaction-date {
          font-size: 0.85rem;
          color: var(--text-secondary);
        }

        .transaction-amount {
          font-weight: 700;
        }

        .transaction-amount.positive {
          color: var(--success);
        }

        .transaction-amount.negative {
          color: var(--error);
        }

        /* Portfolio Screen */
        .portfolio-stats {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        .stat-card {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 1.5rem;
          text-align: center;
        }

        .stat-value {
          font-size: 1.8rem;
          font-weight: 700;
          margin-bottom: 0.5rem;
        }

        .stat-label {
          color: var(--text-secondary);
          font-size: 0.9rem;
        }

        .collect-btn {
          width: 100%;
          background: var(--gradient-success);
          color: white;
          border: none;
          padding: 1rem;
          border-radius: var(--radius);
          font-size: 1.1rem;
          font-weight: 600;
          cursor: pointer;
          transition: var(--transition);
        }

        .collect-btn:hover:not(:disabled) {
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg);
        }

        .collect-btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
        }

        /* Card Screen */
        .card-design {
          background: var(--gradient-primary);
          color: white;
          border-radius: var(--radius-lg);
          padding: 2rem;
          margin-bottom: 1.5rem;
          position: relative;
          overflow: hidden;
        }

        .card-design::before {
          content: '';
          position: absolute;
          top: -50%;
          right: -50%;
          width: 200%;
          height: 200%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
          animation: rotate 20s linear infinite;
        }

        .card-balance {
          font-size: 2rem;
          font-weight: 700;
          margin-bottom: 1rem;
          position: relative;
          z-index: 1;
        }

        .card-actions {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
          margin-bottom: 1.5rem;
        }

        /* Calculator */
        .calculator {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 1.5rem;
          margin-bottom: 1.5rem;
        }

        .calc-input {
          width: 100%;
          background: var(--bg-elevated);
          border: 1px solid var(--border);
          color: var(--text-primary);
          padding: 1rem;
          border-radius: var(--radius);
          font-size: 1rem;
          margin-bottom: 1rem;
        }

        .calc-result {
          text-align: center;
          font-size: 1.2rem;
          font-weight: 600;
          color: var(--success);
        }

        /* About Screen */
        .about-content {
          text-align: center;
          padding: 2rem 0;
        }

        .about-icon {
          font-size: 4rem;
          margin-bottom: 2rem;
        }

        .about-text {
          font-size: 1.1rem;
          line-height: 1.8;
          margin-bottom: 2rem;
          color: var(--text-secondary);
        }

        .features-list {
          text-align: left;
          margin: 2rem 0;
        }

        .feature-item {
          display: flex;
          align-items: center;
          gap: 1rem;
          padding: 1rem 0;
          border-bottom: 1px solid var(--border);
        }

        .feature-icon {
          font-size: 1.5rem;
        }

        /* Partners Screen */
        .partner-stats {
          display: flex;
          justify-content: space-around;
          margin: 2rem 0;
          background: var(--bg-card);
          border-radius: var(--radius);
          padding: 1.5rem;
          border: 1px solid var(--border);
        }

        .partner-stat {
          text-align: center;
        }

        .partner-stat-value {
          font-size: 2rem;
          font-weight: 700;
          color: var(--primary);
        }

        .partner-stat-label {
          font-size: 0.9rem;
          color: var(--text-secondary);
          margin-top: 0.5rem;
        }

        .partner-levels {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 1.5rem;
          margin: 1.5rem 0;
        }

        .level-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem 0;
          border-bottom: 1px solid var(--border);
        }

        .level-item:last-child {
          border-bottom: none;
        }

        /* Footer Links */
        .footer-links {
          display: flex;
          justify-content: center;
          gap: 2rem;
          margin-top: 2rem;
          padding: 1.5rem;
          background: var(--bg-card);
          border-radius: var(--radius);
          border: 1px solid var(--border);
        }

        .footer-link {
          color: var(--primary);
          text-decoration: none;
          font-weight: 600;
          transition: var(--transition);
        }

        .footer-link:hover {
          color: var(--secondary);
          transform: translateY(-2px);
        }

        /* Bottom Navigation */
        .bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: var(--bg-secondary);
          border-top: 1px solid var(--border);
          padding: 0.75rem 0;
          display: flex;
          justify-content: space-around;
          align-items: center;
          backdrop-filter: blur(20px);
          z-index: 1000;
        }

        .nav-item {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.25rem;
          cursor: pointer;
          padding: 0.5rem;
          border-radius: 12px;
          transition: var(--transition);
          min-width: 60px;
        }

        .nav-item.active {
          background: var(--primary);
          color: white;
        }

        .nav-item:not(.active) {
          color: var(--text-secondary);
        }

        .nav-item:hover {
          background: var(--bg-elevated);
        }

        .nav-item.active:hover {
          background: var(--primary-dark);
        }

        .nav-icon {
          font-size: 1.5rem;
        }

        .nav-label {
          font-size: 0.7rem;
          font-weight: 500;
        }

        /* Card icon (special large button) */
        .nav-item.card-nav {
          background: var(--gradient-primary);
          color: white;
          border-radius: 50%;
          padding: 1rem;
          margin: 0 0.5rem;
          transform: scale(1.2);
        }

        .nav-item.card-nav .nav-icon {
          font-size: 2rem;
        }

        .nav-item.card-nav:hover {
          background: var(--gradient-primary);
          transform: scale(1.25);
        }

        /* Animations */
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.7; }
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }

        @keyframes rotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
          .balance-amount {
            font-size: 2rem;
          }
          
          .portfolio-stats, .card-actions {
            grid-template-columns: 1fr;
          }
          
          .action-buttons {
            flex-direction: column;
          }
          
          .partner-stats {
            flex-direction: column;
            gap: 1rem;
          }
          
          .footer-links {
            flex-direction: column;
            gap: 1rem;
            text-align: center;
          }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
          width: 6px;
        }

        ::-webkit-scrollbar-track {
          background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
          background: var(--primary);
          border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div class="loading-logo">🚀</div>
            <div class="loading-spinner"></div>
            <h2>TON STOCKER</h2>
            <p>Загрузка приложения...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ЗАМЕНИТЕ НА ВАШ API URL!
        const API_BASE_URL = 'https://server-3hznro02y-onlylosees-projects.vercel.app/api';
        const USDT_TO_RUB = 95; // Курс для отображения

        const App = () => {
          const [userData, setUserData] = useState(null);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);
          const [activeScreen, setActiveScreen] = useState('main');
          const [calcAmount, setCalcAmount] = useState('');
          const [projectProgress, setProjectProgress] = useState({ current: 0, target: 100000, progress: 0, rate: 5.0 });

          useEffect(() => {
            const initApp = async () => {
              try {
                let userId = 652017464;
                
                if (window.Telegram && window.Telegram.WebApp) {
                  const tg = window.Telegram.WebApp;
                  tg.ready();
                  tg.expand();
                  tg.setBackgroundColor('#0F0F0F');
                  tg.setHeaderColor('#0F0F0F');
                  
                  userId = tg.initDataUnsafe?.user?.id || 652017464;
                }
                
                await loadUserData(userId);
                
                // Auto refresh every 30 seconds
                const interval = setInterval(() => {
                  loadUserData(userId);
                }, 30000);
                
                return () => clearInterval(interval);
                
              } catch (err) {
                console.error('App init error:', err);
                setError('Ошибка инициализации приложения');
                setLoading(false);
              }
            };

            initApp();
          }, []);

          const loadUserData = async (userId) => {
            try {
              const response = await axios.get(`${API_BASE_URL}/user/${userId}`, {
                timeout: 15000,
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
              });

              if (response.data.success) {
                setUserData(response.data.data);
                
                // Calculate project progress (mock data - you should get this from API)
                const totalInvested = response.data.data.total_invested * USDT_TO_RUB;
                let progress = (totalInvested / 100000) * 100;
                let currentRate = 5.0;
                let target = 100000;
                
                if (totalInvested >= 750000) {
                  currentRate = 8.6;
                  target = 750000;
                  progress = 100;
                } else if (totalInvested >= 250000) {
                  currentRate = 7.4;
                  target = 750000;
                  progress = (totalInvested / 750000) * 100;
                } else if (totalInvested >= 100000) {
                  currentRate = 6.2;
                  target = 250000;
                  progress = (totalInvested / 250000) * 100;
                }
                
                setProjectProgress({
                  current: totalInvested,
                  target: target,
                  progress: Math.min(progress, 100),
                  rate: currentRate
                });
                
                setError(null);
              } else {
                throw new Error(response.data.error || 'API Error');
              }
            } catch (err) {
              console.error('Load user data error:', err);
              setError(err.response?.data?.error || err.message || 'Ошибка подключения');
            } finally {
              setLoading(false);
            }
          };

          const collectProfit = async () => {
            if (!userData || userData.current_profit <= 0) {
              alert('Нет доступной прибыли для сбора');
              return;
            }

            try {
              const response = await axios.post(`${API_BASE_URL}/user/${userData.user_id}/collect-profit`, {}, {
                headers: { 'Content-Type': 'application/json' }
              });
              
              if (response.data.success) {
                await loadUserData(userData.user_id);
                alert(`🎉 Собрано ${formatCurrency(response.data.amount * USDT_TO_RUB)}!`);
              } else {
                alert('Ошибка: ' + response.data.error);
              }
            } catch (err) {
              alert('Ошибка сбора прибыли');
            }
          };

          const formatCurrency = (amount) => {
            return new Intl.NumberFormat('ru-RU', {
              style: 'currency',
              currency: 'RUB',
              minimumFractionDigits: 0,
              maximumFractionDigits: 0
            }).format(amount);
          };

          const formatDate = (dateString) => {
            return new Date(dateString).toLocaleDateString('ru-RU', {
              day: '2-digit',
              month: 'short',
              hour: '2-digit',
              minute: '2-digit'
            });
          };

          const calculateProfit = (amount) => {
            const dailyRate = projectProgress.rate / 100;
            return amount * dailyRate;
          };

          if (loading && !userData) {
            return React.createElement('div', { className: 'loading-container' },
              React.createElement('div', { className: 'loading-logo' }, '🚀'),
              React.createElement('div', { className: 'loading-spinner' }),
              React.createElement('h2', null, 'TON STOCKER'),
              React.createElement('p', null, 'Загрузка приложения...')
            );
          }

          if (error && !userData) {
            return React.createElement('div', { className: 'loading-container' },
              React.createElement('div', { style: { fontSize: '4rem' } }, '⚠️'),
              React.createElement('h2', null, 'Ошибка подключения'),
              React.createElement('p', null, error),
              React.createElement('button', {
                onClick: () => {
                  setError(null);
                  setLoading(true);
                  loadUserData(652017464);
                },
                style: {
                  background: 'var(--primary)',
                  color: 'white',
                  border: 'none',
                  padding: '1rem 2rem',
                  borderRadius: '12px',
                  cursor: 'pointer',
                  marginTop: '1rem'
                }
              }, '🔄 Повторить')
            );
          }

          return React.createElement('div', { className: 'app' },
            
            // Header
            React.createElement('header', { className: 'header' },
              React.createElement('h1', null, 'TON STOCKER'),
              React.createElement('button', {
                className: 'refresh-btn',
                onClick: () => loadUserData(userData.user_id)
              }, '🔄')
            ),

            // Content
            React.createElement('div', { className: 'content' },
              
              // Main Screen
              React.createElement('div', { 
                className: `screen ${activeScreen === 'main' ? 'active' : ''}` 
              },
                // Balance Card
                React.createElement('div', { className: 'card balance-card' },
                  React.createElement('div', { className: 'balance-amount' },
                    formatCurrency((userData?.balance || 0) * USDT_TO_RUB)
                  ),
                  React.createElement('div', { className: 'balance-label' },
                    'Всего активов'
                  )
                ),
                
                // Action Buttons
                React.createElement('div', { className: 'action-buttons' },
                  React.createElement('button', { className: 'action-btn' }, '💳 Пополнить'),
                  React.createElement('button', { 
                    className: 'action-btn',
                    onClick: () => setActiveScreen('portfolio')
                  }, '📊 Портфель')
                ),
                
                // Project Bank
                React.createElement('div', { className: 'card project-bank-card' },
                  React.createElement('div', { className: 'card-title' }, '🏦 Банк проекта'),
                  React.createElement('div', null, `Цель: ${formatCurrency(projectProgress.target)}`),
                  React.createElement('div', { className: 'progress-bar' },
                    React.createElement('div', {
                      className: 'progress-fill',
                      style: { width: `${projectProgress.progress}%` }
                    })
                  ),
                  React.createElement('div', null, `Прогресс: ${projectProgress.progress.toFixed(1)}%`),
                  React.createElement('div', null, `Текущая ставка: ${projectProgress.rate}% в день`)
                ),
                
                // Live Transactions
                React.createElement('div', { className: 'card' },
                  React.createElement('div', { className: 'card-title' }, '📈 Live транзакции'),
                  React.createElement('div', { className: 'transactions-live' },
                    userData?.recent_transactions?.length > 0 ? 
                      userData.recent_transactions.slice(0, 5).map((tx, index) =>
                        React.createElement('div', {
                          key: tx.id,
                          className: 'transaction-item'
                        },
                          React.createElement('div', { className: 'transaction-info' },
                            React.createElement('div', { className: 'transaction-type' },
