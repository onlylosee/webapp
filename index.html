<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B1E4E" />
    <title>TON STOCKER</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <!-- Anime.js для анимации navbar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <!-- Box Icons для navbar -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0B1E4E;
            --primary: #1F3BBB;
            --primary-light: #4F70F9;
            --secondary: #13DEDE;
            --success: #27D94B;
            --warning: #FFD942;
            --error: #FF416C;

            --bg-primary: var(--primary-dark);
            --bg-secondary: #102251;
            --bg-card: #162D7B;
            --bg-elevated: #1F3BBB;

            --text-primary: #E7EFFF;
            --text-secondary: #A6B8FF;
            --text-muted: #7891C3;

            --border: #347FFF;
            --border-light: #4A7BE6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 90px;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
        }

        /* Header */
        .header {
            background: #1a1a1a;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(59, 130, 246, 0.5);
        }

        .user-name {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
        }

        .refresh-btn {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-btn:active {
            transform: rotate(180deg);
            background: rgba(59, 130, 246, 0.25);
        }

        /* Content */
        .content {
            min-height: calc(100vh - 140px);
            padding-bottom: 2rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Balance Section */
        .balance-section {
            padding: 1.5rem;
        }

        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .balance-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .balance-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
        }

        .balance-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            line-height: 1;
        }

        .balance-large {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
        }

        .balance-large .balance-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .balance-large .balance-amount {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .btn-deposit {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-deposit:active {
            transform: scale(0.95);
        }

        /* Bank Section */
        .bank-section {
            padding: 0 1.5rem 1.5rem;
        }

        .bank-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .bank-title {
            font-size: 1rem;
            color: #ffffff;
            font-weight: 600;
        }

        .bank-rate {
            font-size: 1.3rem;
            font-weight: 700;
            color: #22c55e;
        }

        .progress-bar {
            background: rgba(34, 197, 94, 0.15);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }

        .bank-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .bank-stats span {
            color: #94a3b8;
        }

        .bank-stats strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Transactions */
        .transactions-section {
            padding: 0 1.5rem 1.5rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0 0 1rem;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .transaction-item {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .transaction-item:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateX(4px);
        }

        .transaction-left {
            flex: 1;
        }

        .transaction-id {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        .transaction-type {
            font-size: 0.95rem;
            color: #3b82f6;
            font-weight: 500;
        }

        .transaction-right {
            text-align: right;
        }

        .transaction-date {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 0.25rem;
        }

        .transaction-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
        }

        /* НОВЫЙ BOTTOM NAVBAR ИЗ ФАЙЛОВ */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 0;
            background: #1a1a1a;
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 0 30px 0 rgba(59, 130, 246, 0.3);
            z-index: 1000;
        }

        .navbar button {
            cursor: pointer;
            width: 60px;
            height: 50px;
            border-radius: 20px;
            background: transparent;
            transition: all 0.3s ease;
            border: none;
        }

        .navbar button i {
            font-size: 1.5rem;
            pointer-events: none;
            color: #7891C3;
        }

        .navbar button.plus {
            height: 60px;
            color: #fff;
            background: #3b82f6;
            border-radius: 50%;
            margin-top: -50px;
            box-shadow: 0 10px 20px 0 rgba(59, 130, 246, 0.6);
        }

        .navbar button.plus:hover {
            transform: translateY(-4px);
        }

        .navbar button.plus i {
            color: #fff;
        }

        .navbar button.active {
            color: #3b82f6;
        }

        .navbar button.active i {
            color: #3b82f6;
        }

        .navbar button.active:not(.plus) {
            transform: scale(1.2);
        }

        .navbar .effect {
            position: absolute;
            width: 60px;
            height: 50px;
            border-radius: 18px;
            background: rgba(59, 130, 246, 0.15);
            opacity: 0;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 1rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="root">
        <div class="loading">
            <div style="font-size: 4rem;">🚀</div>
            <div class="spinner"></div>
            <div style="color: #94a3b8;">Загрузка TON STOCKER...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE_URL = 'https://server-3hznro02y-onlylosees-projects.vercel.app/api';
        const USDT_TO_RUB = 95;

        const App = () => {
            const [userData, setUserData] = useState(null);
            const [liveTransactions, setLiveTransactions] = useState([]);
            const [projectBank, setProjectBank] = useState({ invested: 0, target: 100000, rate: 5.0, progress: 0 });
            const [loading, setLoading] = useState(true);
            const [activeScreen, setActiveScreen] = useState('main');
            const [refreshing, setRefreshing] = useState(false);

            useEffect(() => {
                const init = async () => {
                    try {
                        let userId = 652017464;
                        let userName = 'User';

                        if (window.Telegram?.WebApp) {
                            const tg = window.Telegram.WebApp;
                            tg.ready();
                            tg.expand();
                            tg.setBackgroundColor('#0a0a0a');

                            if (tg.initDataUnsafe?.user) {
                                userId = tg.initDataUnsafe.user.id;
                                userName = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || 'User';
                            }
                        }

                        await loadData(userId, userName);
                        const interval = setInterval(() => loadLiveTransactions(), 3000);
                        return () => clearInterval(interval);
                    } catch (err) {
                        console.error('Init error:', err);
                        setLoading(false);
                    }
                };

                init();
            }, []);

            const loadData = async (userId, userName) => {
                try {
                    const userRes = await axios.get(`${API_BASE_URL}/user/${userId}`);
                    if (userRes.data.success) {
                        const data = userRes.data.data;
                        data.display_name = userName;
                        setUserData(data);
                    }

                    await loadProjectBank();
                    await loadLiveTransactions();
                    setLoading(false);
                } catch (err) {
                    console.error('Load data error:', err);
                    setLoading(false);
                }
            };

            const loadProjectBank = async () => {
                try {
                    const statsRes = await axios.get(`${API_BASE_URL}/admin/stats`);
                    if (statsRes.data.success) {
                        const stats = statsRes.data.data;
                        const totalInvested = stats.total_invested * USDT_TO_RUB;

                        let rate = 5.0;
                        let target = 100000;
                        let progress = 0;

                        if (totalInvested >= 750000) {
                            rate = 8.6;
                            target = 750000;
                            progress = 100;
                        } else if (totalInvested >= 250000) {
                            rate = 7.4;
                            target = 750000;
                            progress = totalInvested / 750000 * 100;
                        } else if (totalInvested >= 100000) {
                            rate = 6.2;
                            target = 250000;
                            progress = totalInvested / 250000 * 100;
                        } else {
                            progress = totalInvested / 100000 * 100;
                        }

                        setProjectBank({ invested: totalInvested, target: target, rate: rate, progress: Math.min(progress, 100) });
                    }
                } catch (err) {
                    console.error('Load bank error:', err);
                }
            };

            const loadLiveTransactions = async () => {
                try {
                    const txRes = await axios.get(`${API_BASE_URL}/transactions/recent`);
                    if (txRes.data.success && txRes.data.data) {
                        const transactions = txRes.data.data.map(tx => ({
                            id: tx.id,
                            type: 'Пополнение баланса',
                            amount: (tx.amount * USDT_TO_RUB).toFixed(2),
                            date: new Date(tx.created_at).toLocaleString('ru-RU', {
                                day: '2-digit',
                                month: '2-digit',
                                year: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit'
                            })
                        }));
                        setLiveTransactions(transactions.slice(0, 10));
                    }
                } catch (err) {
                    console.error('Load transactions error:', err);
                }
            };

            const handleRefresh = async () => {
                if (refreshing) return;
                setRefreshing(true);
                try {
                    if (userData) {
                        await loadData(userData.user_id, userData.display_name);
                    }
                } catch (err) {
                    console.error('Refresh error:', err);
                } finally {
                    setTimeout(() => setRefreshing(false), 1000);
                }
            };

            const formatMoney = amount => {
                return new Intl.NumberFormat('ru-RU', {
                    style: 'decimal',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 2
                }).format(amount) + 'Р';
            };

            if (loading) {
                return React.createElement('div', { className: 'loading' },
                    React.createElement('div', { style: { fontSize: '4rem' } }, '🚀'),
                    React.createElement('div', { className: 'spinner' }),
                    React.createElement('div', { style: { color: '#94a3b8' } }, 'Загрузка...')
                );
            }

            const userName = userData?.display_name || 'User';
            const userInitial = userName.charAt(0).toUpperCase();

            return React.createElement('div', { className: 'app' },
                React.createElement('header', { className: 'header' },
                    React.createElement('div', { className: 'user-info' },
                        React.createElement('div', { className: 'user-avatar' }, userInitial),
                        React.createElement('div', { className: 'user-name' }, userName)
                    ),
                    React.createElement('button', {
                        className: 'refresh-btn',
                        onClick: handleRefresh,
                        disabled: refreshing
                    }, refreshing ? '⏳' : '🔄')
                ),

                React.createElement('div', { className: 'content' },
                    React.createElement('div', { className: `screen ${activeScreen === 'main' ? 'active' : ''}` },
                        React.createElement('div', { className: 'balance-section' },
                            React.createElement('div', { className: 'balance-grid' },
                                React.createElement('div', { className: 'balance-card balance-large' },
                                    React.createElement('div', { className: 'balance-label' }, 'Всего активов (RUB)'),
                                    React.createElement('div', { className: 'balance-amount' },
                                        formatMoney((userData?.balance || 0) * USDT_TO_RUB).replace('Р', '')
                                    ),
                                    React.createElement('button', {
                                        className: 'btn-deposit',
                                        onClick: () => alert('Пополнение скоро!')
                                    }, '💰 Пополнить')
                                ),
                                React.createElement('div', { className: 'balance-card' },
                                    React.createElement('div', { className: 'balance-label' }, 'Прибыль'),
                                    React.createElement('div', { className: 'balance-amount' },
                                        formatMoney((userData?.current_profit || 0) * USDT_TO_RUB).replace('Р', '')
                                    )
                                ),
                                React.createElement('div', { className: 'balance-card' },
                                    React.createElement('div', { className: 'balance-label' }, 'Инвестировано'),
                                    React.createElement('div', { className: 'balance-amount' },
                                        formatMoney((userData?.total_invested || 0) * USDT_TO_RUB).replace('Р', '')
                                    )
                                )
                            )
                        ),
                        
                        React.createElement('div', { className: 'bank-section' },
                            React.createElement('div', { className: 'bank-card' },
                                React.createElement('div', { className: 'bank-header' },
                                    React.createElement('div', { className: 'bank-title' }, '🏦 Банк проекта'),
                                    React.createElement('div', { className: 'bank-rate' }, `${projectBank.rate}% в день`)
                                ),
                                React.createElement('div', { className: 'progress-bar' },
                                    React.createElement('div', {
                                        className: 'progress-fill',
                                        style: { width: `${projectBank.progress}%` }
                                    })
                                ),
                                React.createElement('div', { className: 'bank-stats' },
                                    React.createElement('span', null,
                                        'Инвестировано: ',
                                        React.createElement('strong', null, formatMoney(projectBank.invested))
                                    ),
                                    React.createElement('span', null,
                                        'Цель: ',
                                        React.createElement('strong', null, formatMoney(projectBank.target))
                                    )
                                )
                            )
                        ),
                        
                        React.createElement('div', { className: 'transactions-section' },
                            React.createElement('div', { className: 'section-header' },
                                React.createElement('div', { className: 'live-indicator' }),
                                'Live Транзакции'
                            ),
                            liveTransactions.map(tx =>
                                React.createElement('div', { key: tx.id, className: 'transaction-item' },
                                    React.createElement('div', { className: 'transaction-left' },
                                        React.createElement('div', { className: 'transaction-id' }, `ID:${tx.id}`),
                                        React.createElement('div', { className: 'transaction-type' }, tx.type)
                                    ),
                                    React.createElement('div', { className: 'transaction-right' },
                                        React.createElement('div', { className: 'transaction-date' }, tx.date),
                                        React.createElement('div', { className: 'transaction-amount' }, `+${tx.amount}Р`)
                                    )
                                )
                            )
                        )
                    )
                ),

                // НОВЫЙ NAVBAR ИЗ ФАЙЛОВ
                React.createElement('div', { className: 'navbar' },
                    React.createElement('div', { className: 'effect' }),
                    React.createElement('button', {
                        className: activeScreen === 'main' ? 'active' : '',
                        onClick: () => setActiveScreen('main')
                    }, React.createElement('i', { className: 'bx bx-home-alt-2' })),
                    React.createElement('button', {
                        className: activeScreen === 'portfolio' ? 'active' : '',
                        onClick: () => setActiveScreen('portfolio')
                    }, React.createElement('i', { className: 'bx bx-user' })),
                    React.createElement('button', {
                        className: 'plus',
                        onClick: () => setActiveScreen('card')
                    }, React.createElement('i', { className: 'bx bx-plus' })),
                    React.createElement('button', {
                        className: activeScreen === 'about' ? 'active' : '',
                        onClick: () => setActiveScreen('about')
                    }, React.createElement('i', { className: 'bx bx-message-square' })),
                    React.createElement('button', {
                        className: activeScreen === 'partners' ? 'active' : '',
                        onClick: () => setActiveScreen('partners')
                    }, React.createElement('i', { className: 'bx bx-cog' }))
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>

    <!-- Navbar Animation Script -->
    <script>
        setTimeout(() => {
            const effect = document.querySelector(".effect");
            const buttons = document.querySelectorAll(".navbar button:not(.plus)");

            buttons.forEach((button) => {
                button.addEventListener("click", (e) => {
                    const x = e.target.offsetLeft;
                    buttons.forEach((btn) => {
                        btn.classList.remove("active");
                    });
                    e.target.classList.add("active");

                    anime({
                        targets: ".effect",
                        left: `${x}px`,
                        opacity: 1,
                        duration: 600,
                    });
                });
            });
        }, 500);
    </script>
</body>
</html>
